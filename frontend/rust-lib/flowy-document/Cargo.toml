[package]
name = "flowy-document"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collab = { workspace = true }
collab-document = { workspace = true }
collab-entity = { workspace = true }
collab-plugins = { workspace = true }
collab-integrate = { workspace = true }
flowy-document-pub = { workspace = true }
flowy-storage-pub = { workspace = true }
flowy-derive.workspace = true
flowy-notification = { workspace = true }
flowy-error = { path = "../flowy-error", features = ["impl_from_serde", "impl_from_dispatch_error", "impl_from_collab_document", "impl_from_collab_persistence"] }
lib-dispatch = { workspace = true }
lib-infra = { workspace = true }
validator = { workspace = true, features = ["derive"] }
protobuf.workspace = true
bytes.workspace = true
nanoid = "0.4.0"
strum_macros = "0.21"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt"] }
indexmap = { version = "2.1.0", features = ["serde"] }
uuid.workspace = true
futures.workspace = true
dashmap.workspace = true
scraper = "0.18.0"
chrono = { workspace = true, features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
docx-rs = "0.4"
zip = "0.6"
image = "0.24"
# PDF processing dependencies - using native PDFium library
lopdf = "0.32"  # Keep as fallback
html-escape = "0.2"
regex = "1.0"
xml = "0.8"
# Enhanced PDF processing dependencies
base64 = "0.22"
tempfile = "3.4"
# Unicode and text processing
unicode-normalization = "0.1"
encoding_rs = "0.8"
# System integration and FFI
libc = "0.2"
cc = "1.0"
bindgen = "0.69"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3.4.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[build-dependencies]
flowy-codegen.workspace = true

[features]
dart = ["flowy-codegen/dart"]
# search "Enable/Disable AppFlowy Verbose Log" to find the place that can enable verbose log
verbose_log = ["collab-document/verbose_log"]
