script = ["""
  cd appflowy_flutter/
  flutter pub get
  flutter build ipa --split-debug-info=./ --obfuscate --verbose
  """]
script_runner = "@shell"

[tasks.flutter-build-android]
script = ["""
  cd appflowy_flutter/
  flutter pub get
  flutter build apk --split-per-abi --split-debug-info=./ --obfuscate --verbose
  """]
script_runner = "@shell"

[tasks.flutter-build-android-ci]
script = ["""
  cd appflowy_flutter/
  flutter pub get
  flutter build apk --debug
  """]
