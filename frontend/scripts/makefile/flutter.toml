[tasks.flutter-build.windows]
script = [
  """
  cd appflowy_flutter
  exec cmd.exe /c flutter pub get
  exec cmd.exe /c flutter build ${TARGET_OS} --${BUILD_FLAG} --build-name=${APP_VERSION}
  """,
]
script_runner = "@duckscript"

[tasks.copy-marker-to-build-output-windows]
private = true
script = [
  """
  # Copy marker tool to build output directory for Windows
  echo Copying marker tool to Windows build output...
  build_output_dir= set ${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/appflowy_flutter/build/${TARGET_OS}/${BUILD_ARCHS}/runner/${FLUTTER_OUTPUT_DIR}
  marker_resources_dir= set ${build_output_dir}/Resources/marker
  mkdir ${marker_resources_dir}

  # Try to find marker tool from various possible locations
  marker_source= set ""
  marker_tool_path= get_env MARKER_TOOL_PATH
  if not is_empty ${marker_tool_path}
    if is_path_exists ${marker_tool_path}
      marker_source= set ${marker_tool_path}
      echo Using marker tool from MARKER_TOOL_PATH: ${marker_source}
    end
  end

  if is_empty ${marker_source}
    tools_marker= set ${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools/marker/marker.exe
    if is_path_exists ${tools_marker}
      marker_source= set ${tools_marker}
      echo Using marker tool from tools/marker/marker.exe
    end
  end

  if is_empty ${marker_source}
    resources_marker= set ${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/resources/marker/marker.exe
    if is_path_exists ${resources_marker}
      marker_source= set ${resources_marker}
      echo Using marker tool from resources/marker/marker.exe
    end
  end

  if is_empty ${marker_source}
    # Try to find marker.exe in system PATH
    marker_path_output= exec where marker.exe
    marker_path_stdout= set ${marker_path_output.stdout}
    if not is_empty ${marker_path_stdout}
      marker_lines= split ${marker_path_stdout} "\\n"
      marker_first_line= array_get ${marker_lines} 0
      if not is_empty ${marker_first_line}
        marker_source= set ${marker_first_line}
        echo Using marker tool from system PATH: ${marker_source}
      end
    end
  end

  if not is_empty ${marker_source}
    if is_path_exists ${marker_source}
      # Copy marker tool
      cp ${marker_source} ${marker_resources_dir}/marker.exe
      echo Marker tool copied to build output: ${marker_resources_dir}/marker.exe
      
      # Copy marker tool dependencies if they exist (e.g., Python environment)
      marker_source_dir= dirname ${marker_source}
      marker_python_dir= set ${marker_source_dir}/python
      if is_path_exists ${marker_python_dir}
        echo Copying marker Python environment to build output...
        glob_cp ${marker_python_dir}/**/* ${marker_resources_dir}/python
        echo Marker Python environment copied
      end
      
      # Copy any other marker dependencies
      marker_lib_dir= set ${marker_source_dir}/lib
      if is_path_exists ${marker_lib_dir}
        echo Copying marker libraries to build output...
        glob_cp ${marker_lib_dir}/**/* ${marker_resources_dir}/lib
        echo Marker libraries copied
      end
      
      # Verify marker tool exists
      marker_exe= set ${marker_resources_dir}/marker.exe
      if is_path_exists ${marker_exe}
        echo Marker tool verification: file exists in build output
      else
        echo Warning: Marker tool may not have been copied correctly to build output
      end
    else
      echo Warning: Marker tool source path does not exist: ${marker_source}
    end
  else
    echo Warning: Marker tool not found for build output. Expected locations:
    echo   - MARKER_TOOL_PATH environment variable
    echo   - ${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools/marker/marker.exe
    echo   - ${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/resources/marker/marker.exe
    echo   - System PATH (marker.exe)
    echo Marker tool will not be included in the build output.
  end
  """,
]
script_runner = "@duckscript"

[tasks.pub_get]
script_runner = "@shell"
script = ["""
  cd appflowy_flutter
  flutter clean
  flutter pub get
  cd ../
  """]

[tasks.pub_get.windows]
